name: Heartbeat

# 作用：保持仓库活跃 —— GitHub 会禁用「长时间无活动仓库」的定时任务，
# 每天一次空提交可以避免 watch.yml 的 schedule 被停掉。
#
# 注意：这里不再轮询 UUMit，也不做「凭据自检」。
# 原因：GitHub Actions（海外机房）无法直连 api.uumit.com（TCP 超时），
#       之前的自检每天必然失败并误报「凭据失效」。
# 真正的轮询 + 通知已由 阿里云 FC 云函数（uumit-watchdog，每 15 分钟）承担，
# 本工作流仅作为仓库保活与 Actions 通道自检，静默运行，不打扰。
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  beat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 心跳（静默保活）
        run: |
          echo "Heartbeat OK：仓库保活中。"
          echo "UUMit 轮询由阿里云 FC 负责；本工作流不再轮询 UUMit，不再发凭据告警。"

      - name: 空提交保活
        run: |
          git config user.name  "uumit-watchdog[bot]"
          git config user.email "watchdog@users.noreply.github.com"
          git commit --allow-empty -m "chore: heartbeat [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo "推送失败，可忽略"
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
